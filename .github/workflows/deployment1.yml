name: Deployment Excercise 1
on: push
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get a code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Check Lint issues
              run: npm run lint
            - name: Test Code
              run: npm run test
            - name: Build the code
              run: npm run build
            - name: Deploy code
              run: echo "Deploying..."

